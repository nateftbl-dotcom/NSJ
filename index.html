<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NateFTBL Music Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🎵 Music Visualizer</h1>
        </header>

        <!-- Controls Panel -->
        <div class="controls-panel">
            <!-- Text Input -->
            <div class="control-group">
                <label for="textInput">Display Text:</label>
                <input type="text" id="textInput" value="NateFTBL" maxlength="20">
            </div>

            <!-- Audio Source Selector -->
            <div class="control-group">
                <label for="audioSource">Audio Source:</label>
                <select id="audioSource">
                    <option value="microphone">Microphone</option>
                    <option value="tab">Browser Tab</option>
                    <option value="file">Upload File</option>
                </select>
                <input type="file" id="fileInput" accept="audio/*" style="display: none;">
            </div>

            <!-- Visualizer Mode -->
            <div class="control-group">
                <label>Visualizer Mode:</label>
                <div class="button-group">
                    <button class="mode-btn active" data-mode="spectrum">Spectrum Bars</button>
                    <button class="mode-btn" data-mode="particles">Particles</button>
                    <button class="mode-btn" data-mode="colorshift">Color Shift</button>
                </div>
            </div>

            <!-- Sensitivity Slider -->
            <div class="control-group">
                <label for="sensitivity">Sensitivity:</label>
                <input type="range" id="sensitivity" min="1" max="10" value="5" step="0.5">
                <span id="sensitivityValue">5.0</span>
            </div>

            <!-- Start/Stop Button -->
            <div class="control-group">
                <button id="startStopBtn" class="primary-btn">Start Visualizer</button>
            </div>

            <!-- Status -->
            <div class="status" id="status">
                Ready to start
            </div>
        </div>

        <!-- Canvas Container -->
        <div id="canvasContainer"></div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- App Scripts -->
    <script type="module" src="audioManager.js"></script>
    <script type="module" src="visualizers.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
